name: Import Show Planner Spain original public website images
on:
  push:
    paths: [".github/workflows/import-original-media.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download authentic public media from original website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor
          assets=[
           ('logo-original.png','https://www.showplannerspain.es/wp-content/uploads/go-x/u/a17cc974-26e0-4e2d-815e-1f7e8e577781/image-455x455.png'),
           ('espectaculo-01.webp','https://www.showplannerspain.es/wp-content/uploads/go-x/u/373cab24-4b72-41f5-9896-679ec6d13fd6/l0,t0,w1536,h1024/image-768x512.webp'),
           ('espectaculo-02.webp','https://www.showplannerspain.es/wp-content/uploads/go-x/u/6e85a1bb-60e2-47c9-95bb-18f4a030cca0/l0,t0,w960,h640/image-768x512.webp'),
           ('espectaculo-03.jpg','https://www.showplannerspain.es/wp-content/uploads/go-x/u/62148660-ff81-4fb1-a6f3-1c60f3ae999a/l270,t0,w1080,h1080/image-768x768.jpg'),
          ]
          out=Path('assets');out.mkdir(exist_ok=True)
          def download(item):
           name,url=item
           req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ShowPlannerMigration/1.0)'})
           with urllib.request.urlopen(req,timeout=25) as r:
            data=r.read()
            mime=r.headers.get_content_type()
           assert len(data)>3000,(name,'file too short')
           assert data[:4].startswith((b'RIFF',b'\x89PNG',b'\xff\xd8')),(name,'invalid image signature')
           (out/name).write_bytes(data)
           return f'{name}: {len(data)} bytes, {mime}'
          for item in assets:
           try:
            print(download(item))
           except Exception as e:
            print(f'WARNING: {item[0]} could not be imported: {e}')
          assert list(out.glob('*')), 'None of the original assets could be imported'
          PY
      - name: Commit imported website media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Import original Show Planner website media into independent repository" && git push)
