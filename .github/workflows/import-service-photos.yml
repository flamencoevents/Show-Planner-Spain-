name: Import six service photographs
on:
  push:
    paths:
      - '.github/workflows/import-service-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install imaging dependencies
        run: python -m pip install --quiet pillow
      - name: Download and optimize verified Pexels photographs
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageOps
          from pathlib import Path
          import urllib.request,io
          sources=[["service-01.webp",7715754,"Música en directo — banda sobre el escenario"],["service-02.webp",14935288,"Baile — intérprete con vestido rojo"],["service-03.webp",33914523,"Temáticas personalizadas — salón ambientado"],["service-04.webp",35243129,"DJ — mezcla de música en directo"],["service-05.webp",34079361,"Celebraciones — decoración cálida para evento"],["service-06.webp",9275222,"Empresas — audiencia en conferencia"]]
          Path("assets").mkdir(exist_ok=True)
          for filename,number,label in sources:
              url=f"https://images.pexels.com/photos/{number}/pexels-photo-{number}.jpeg?auto=compress&cs=tinysrgb&w=1100"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; ShowPlannerSite/1.0)"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  data=response.read()
                  print("SOURCE",number,"HTTP",response.status,"bytes",len(data))
              assert len(data)>8000,(number,"invalid photo")
              im=Image.open(io.BytesIO(data))
              im=ImageOps.exif_transpose(im).convert("RGB")
              if im.width>1100:im.thumbnail((1100,1100))
              im.save("assets/"+filename,"WEBP",quality=84,method=5)
              print("SAVED",filename,im.size,Path("assets/"+filename).stat().st_size)
          PY
      - name: Commit downloaded images for independent website hosting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/service-0*.webp
          git diff --cached --quiet || (git commit -m "Store six licensed event service photos locally" && git push)
